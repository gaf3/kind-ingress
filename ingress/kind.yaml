# The ingress cluster, and the only one: kind create cluster --name ingress --config ingress/kind.yaml
# It holds host ports 80 and 443, which go to Traefik's node ports 30080 and 30443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80
    listenAddress: "127.0.0.1"
  - containerPort: 30443
    hostPort: 443
    listenAddress: "127.0.0.1"
