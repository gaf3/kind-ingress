# Applied to every cluster. Any name under .localhost is answered with the hub's node, so a pod uses the same
# <service>.<namespace>.<cluster>.localhost a browser does, in or across clusters. The hub is reached by its
# container name on the kind network, which Docker's DNS answers through the forward below.
# The rest is kind's own Corefile for kindest/node v1.35.0: check it again when the node image changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        rewrite name regex ^(.+)\.localhost\.$ ingress-control-plane. answer auto
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
