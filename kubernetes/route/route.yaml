# Applied to the hub for each other cluster. __NAME__ is replaced by make.
# Everything under *.__NAME__.localhost goes to that cluster's Traefik, Host header untouched.
apiVersion: v1
kind: Service
metadata:
  name: __NAME__
  namespace: traefik
spec:
  type: ExternalName
  externalName: __NAME__-control-plane
  ports:
  - port: 30080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: __NAME__
  namespace: traefik
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: HostRegexp(`^.+\.__NAME__\.localhost$`)
    services:
    - name: __NAME__
      port: 30080
