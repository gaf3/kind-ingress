# The hub: the only cluster that listens on the host. Its Traefik takes ports 80 and 443 and routes
# *.<cluster>.localhost to the other clusters by their node's container name on the kind network.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80
    listenAddress: "127.0.0.1"
  - containerPort: 30443
    hostPort: 443
    listenAddress: "127.0.0.1"
