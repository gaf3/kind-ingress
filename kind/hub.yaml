# The hub: the only cluster that listens on the host. Its Traefik takes ports 80 and 443 and routes
# *.<cluster>.localhost to the other clusters by their node's container name on the kind network.
# Its Traefik Service is a NodePort on 80 and 443 themselves, so pods on the kind network reach
# ingress-control-plane:80 the same way the browser reaches 127.0.0.1:80. That needs the node port range
# widened, which only happens when the cluster is made: an existing hub has to be deleted and made again.
# kind hands kubeadm v1beta3 for this node image, where extraArgs is a map; v1beta4's list of name/value is refused.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        service-node-port-range: "80-32767"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    listenAddress: "127.0.0.1"
  - containerPort: 443
    hostPort: 443
    listenAddress: "127.0.0.1"
